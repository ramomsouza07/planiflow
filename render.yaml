services:
  - type: web
    name: planiflow-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ENCRYPTION_KEY
        value: planiflow_super_seguro_jwt_2026_isolated
      - key: JWT_SECRET
        generateValue: true
